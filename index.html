<!DOCTYPE html>
<html lang en>
    <head>
        <title> Water Diary</title>
        <link href="style.css" type="text/css" rel="stylesheet">
        <link rel="icon" type="image/png" href="favicon.png">
    </head>

    <body>
        <div class="container">
            <h1>Daily Water Counter</h1>
            <h2 id="count-el">0</h2>
            <p id="description">How Many Glasses of Water You Drank Today?</p>
            

            <button id="increment-btn" onclick="increment()">+ 1 Glass</button>
            <br>
            <button id="save-btn" onclick="save()">SAVE</button>
            <p id="save-el">Previous Entries: </p>
        </div>
        
    <script src="Water Diary.js"></script>
    </body>
</html>
